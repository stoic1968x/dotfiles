#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16

#Eu adicionei
env = HYPRSHOT_DIR, /home/arch-pc/Pictures/Screenshots/

# EU adicionei recomendado para placa da Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = NVD_BACKEND,direct

env = __GL_GSYNC_ALLOWED, 0  #Configuração que permite o GSYNC 0 ou 1
env = __GL_VRR_ALLOWED, 0 #Configuração que permite o VRRR (Variable Refresh Rate) 0 ou 1
